name: Generate Jars
on: [ push, pull_request ]
jobs:
  paperclip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Run tests
        run: ./gradlew test --stacktrace
      - name: Build Paperclip jar
        run: ./gradlew createPaperclipJar --stacktrace
      - name: Build MultiPaper-Master jar
        run: ./gradlew :multipaper-master:shadowJar --stacktrace
      - name: Upload Paperclip jar
        uses: actions/upload-artifact@v4
        with:
          name: multipaper.jar
          path: multipaper-server/build/libs/multipaper-paperclip-*.jar
      - name: Upload MultiPaper-Master jar
        uses: actions/upload-artifact@v4
        with:
          name: multipaper-master.jar
          path: MultiPaper-Master/build/libs/multipaper-master*.jar
